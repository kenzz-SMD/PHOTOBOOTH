<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photobooth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Welcome Screen -->
  <div id="welcome-screen">
    <h1>📸 Welcome to the Photobooth!</h1>
    <p>Get ready to strike a pose.</p>
    <button id="start-btn">Start</button>
  </div>

  <!-- Template Screen -->
  <div id="template-screen" class="hidden">
    <h1>Choose your template</h1>
    <div id="template-list"></div>
    <button id="template-confirm" disabled>Continue</button>
  </div>

  <!-- Booth Screen -->
  <div id="booth-screen" class="hidden">
    <h1>My Photobooth</h1>
    <p id="template-label"></p>
    <div id="video-wrap">
      <video id="camera" autoplay playsinline></video>
      <div id="countdown"></div>
      <div id="flash"></div>
    </div>
    <canvas id="canvas" class="hidden"></canvas>
    <canvas id="strip-canvas" class="hidden"></canvas>

    <br>
    <button id="strip-btn">🎞️ Capture Strip (4 Photos)</button>
    <button id="change-template-btn">🖼️ Change Template</button>

    <div id="result"></div>
    <button id="print-btn" class="hidden">🖨️ Print Photo Strip</button>
    <button id="download-btn" class="hidden">⬇️ Download Photo Strip</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
