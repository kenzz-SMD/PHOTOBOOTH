<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Payment status · Timeless Strips</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #44323c; background: #fff6f1; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 15% 10%, #ffe1d1, transparent 42%), radial-gradient(circle at 90% 90%, #f5d8f4, transparent 40%), #fff6f1; }
    main { width: min(480px, 100%); padding: 30px; border: 1px solid #fff; border-radius: 26px; background: rgba(255,255,255,.82); box-shadow: 0 22px 70px rgba(93,53,75,.17); text-align: center; }
    .icon { font-size: 42px; }
    h1 { margin: 10px 0; font-size: 25px; }
    p { color: #786875; line-height: 1.55; }
    button { margin-top: 12px; padding: 11px 20px; border: 0; border-radius: 999px; color: #fff; background: linear-gradient(135deg,#ff8fab,#ff5d7a); font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div id="payment-icon" class="icon" aria-hidden="true">⏳</div>
    <h1 id="payment-title">Checking your payment</h1>
    <p id="payment-message" role="status">Keep the photobooth tab open. Your purchase is unlocked after PayMongo confirms your GCash payment.</p>
    <button id="close-payment" type="button">Return to photobooth</button>
  </main>
  <script src="cloud-config.js"></script>
  <script>
    (function () {
      'use strict';
      const query = new URLSearchParams(location.search);
      const orderId = query.get('order') || '';
      const deviceId = query.get('device') || '';
      const canceled = query.get('state') === 'cancel';
      const icon = document.getElementById('payment-icon');
      const title = document.getElementById('payment-title');
      const message = document.getElementById('payment-message');
      document.getElementById('close-payment').addEventListener('click', function () {
        window.close();
        setTimeout(function () { location.href = 'index.html'; }, 250);
      });

      if (canceled) {
        icon.textContent = '↩️';
        title.textContent = 'Checkout closed';
        message.textContent = 'If you completed payment before returning here, leave the photobooth open while PayMongo confirms it. Otherwise, return to the booth and retry checkout when ready.';
      }
      if (!/^[0-9a-f-]{36}$/i.test(orderId) || !/^dev-[a-z0-9]+$/i.test(deviceId) ||
          !window.CLOUD_CONFIG || !window.CLOUD_CONFIG.url || !window.CLOUD_CONFIG.key) {
        if (!canceled) {
          icon.textContent = '⚠️';
          title.textContent = 'Could not check payment';
          message.textContent = 'Return to the photobooth tab to check the current payment status.';
        }
        return;
      }

      async function checkStatus() {
        const response = await fetch(window.CLOUD_CONFIG.url.replace(/\/+$/, '') + '/functions/v1/payment-status', {
          method: 'POST',
          headers: { apikey: window.CLOUD_CONFIG.key, 'Content-Type': 'application/json' },
          body: JSON.stringify({ order_id: orderId, device_id: deviceId })
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) throw new Error(data.error || 'Payment status request failed.');
        return data;
      }

      let attempts = 0;
      let connectionFailures = 0;
      const timer = setInterval(async function () {
        if (++attempts > 120) {
          clearInterval(timer);
          icon.textContent = '⌛';
          title.textContent = 'Payment confirmation timed out';
          message.textContent = 'If you already paid, keep the photobooth tab open and check the status there before trying checkout again.';
          return;
        }
        try {
          const status = await checkStatus();
          connectionFailures = 0;
          if (status.status === 'paid') {
            clearInterval(timer);
            icon.textContent = '✅';
            title.textContent = 'Payment confirmed';
            message.textContent = status.plan_id
              ? (status.product_name || 'Your plan') + ' has been added to this booth. Return to the photobooth tab; it will open automatically.'
              : status.quantity + ' ' + status.media_type.toUpperCase() +
                ' save' + (status.quantity === 1 ? '' : 's') + ' added to your photobooth device. Return to the booth tab to save.';
          } else if (status.status === 'failed' || status.status === 'expired') {
            clearInterval(timer);
            icon.textContent = '❌';
            title.textContent = status.status === 'failed' ? 'Payment declined' : 'Checkout timed out';
            message.textContent = status.status === 'failed'
              ? 'Payment failed. Your GCash payment was declined. Return to the booth and try again.'
              : 'Payment did not complete before checkout expired. Return to the booth and try again.';
          } else if (status.status === 'pending' && status.payment_attempt_status === 'failed') {
            clearInterval(timer);
            icon.textContent = '❌';
            title.textContent = 'Payment declined';
            message.textContent = 'Your GCash payment was declined. Return to the booth to retry the same secure checkout.';
          }
        } catch (error) {
          console.error('Could not check payment status:', error);
          connectionFailures += 1;
          if (connectionFailures >= 4) {
            clearInterval(timer);
            icon.textContent = '📶';
            title.textContent = 'Connection issue';
            message.textContent = 'Connection issue, please retry. If you paid, check the booth tab before trying checkout again.';
          }
        }
      }, 3000);
    })();
  </script>
</body>
</html>
